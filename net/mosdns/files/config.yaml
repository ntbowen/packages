log:
  level: error
  file: ''

plugins:
  # Domain sets
  - tag: geosite_cn
    type: domain_set
    args:
      files:
        - "/etc/mosdns/data/geosite_cn.txt"

  - tag: geosite_not_cn
    type: domain_set
    args:
      files:
        - "/etc/mosdns/data/geosite_geolocation-!cn.txt"

  - tag: geosite_ads
    type: domain_set
    args:
      files:
        - "/etc/mosdns/data/geosite_category-ads-all.txt"

  # IP set
  - tag: geoip_cn
    type: ip_set
    args:
      files:
        - "/etc/mosdns/data/geoip_cn.txt"

  # Cache
  - tag: cache
    type: cache
    args:
      size: 1024

  # Forward to local DNS server
  - tag: forward_local
    type: forward
    args:
      upstreams:
        - addr: https://1.12.12.12/dns-query
        - addr: https://223.5.5.5/dns-query

  # Forward to remote DNS server
  - tag: forward_remote
    type: forward
    args:
      upstreams:
        - addr: https://8.8.8.8/dns-query
        - addr: https://1.1.1.1/dns-query

  # Primary sequence: forward local, drop if not CN IP
  - tag: forward_local_check_cn
    type: sequence
    args:
      - exec: $forward_local
      - matches:
          - "!resp_ip $geoip_cn"
          - has_wanted_ans
        exec: drop_resp

  # Secondary sequence: forward remote
  - tag: forward_remote_seq
    type: sequence
    args:
      - exec: $forward_remote

  # Fallback: local first, remote if local returns non-CN IP
  - tag: fallback_local_remote
    type: fallback
    args:
      primary: forward_local_check_cn
      secondary: forward_remote_seq
      threshold: 200

  # Main sequence
  - tag: main_sequence
    type: sequence
    args:
      - exec: $cache
      - matches:
          - "qname $geosite_ads"
        exec: black_hole
      - matches:
          - "qname $geosite_ads"
        exec: accept
      - matches:
          - "qname $geosite_cn"
        exec: $forward_local
      - matches:
          - "qname $geosite_cn"
        exec: accept
      - matches:
          - "qname $geosite_not_cn"
        exec: $forward_remote
      - matches:
          - "qname $geosite_not_cn"
        exec: accept
      - exec: $fallback_local_remote

  # UDP server
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:6052

  # TCP server
  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:6052

  # UDP server IPv6
  - tag: udp_server_v6
    type: udp_server
    args:
      entry: main_sequence
      listen: "[::1]:6052"

  # TCP server IPv6
  - tag: tcp_server_v6
    type: tcp_server
    args:
      entry: main_sequence
      listen: "[::1]:6052"
